name: Validate single-component Riemannian EM

on:
  push:
    branches: [validation/em-single-component-axis-20261115]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, autograd]
    env:
      GEOMSTATS_BACKEND: ${{ matrix.backend }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      JUPYTER_PLATFORM_DIRS: 1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: abc78a6b66784a8c95a3c94583c90df8d3d275c4
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Install package and validation dependencies
        run: |
          python -m pip install --no-cache-dir -e '.[autograd,graph,test]' pytest pytest-cov ruff==0.4.8 pre-commit
          python -m pip freeze
      - name: Reproduce singleton-component regressions on the original implementation
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET
          
          source = pathlib.Path("geomstats/learning/expectation_maximization.py")
          candidate = source.read_bytes()
          try:
              source.write_bytes(subprocess.check_output(["git", "show", "2fc8e25eb8955767292552f9c0c1438be362ba8f:geomstats/learning/expectation_maximization.py"]))
              result = subprocess.run([
                  "python", "-m", "pytest", "-q",
                  "tests/tests_geomstats/test_learning/test_em_single_component.py",
                  "--junitxml=baseline-regressions.xml",
              ], check=False)
          finally:
              source.write_bytes(candidate)
          root = ET.parse("baseline-regressions.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          counts = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          print({"baseline_exit": result.returncode, **counts})
          assert result.returncode == 1 and counts == {"tests": 8, "failures": 6, "errors": 0, "skipped": 0}, counts
          
          PY
      - name: Run complete affected learning and geometry modules
        run: |
          python - <<'PY'
          import random
          import sys
          import geomstats.backend as gs
          import pytest

          # Seed the repository's randomized geometry fixtures before collection.
          random.seed(0)
          gs.random.seed(0)
          sys.exit(pytest.main([
              "-q", "tests/tests_geomstats/test_learning",
              "tests/tests_geomstats/test_geometry/test_euclidean.py",
              "tests/tests_geomstats/test_geometry/test_poincare_ball.py",
              "-m", "not (slow or redundant)", "--junitxml=candidate-tests.xml",
          ]))
          PY
      - name: Check formatting, hooks, and exact candidate source
        run: |
          ruff check geomstats/learning/expectation_maximization.py tests/tests_geomstats/test_learning/test_em_single_component.py
          ruff format --diff geomstats/learning/expectation_maximization.py tests/tests_geomstats/test_learning/test_em_single_component.py || true
          ruff format --check geomstats/learning/expectation_maximization.py tests/tests_geomstats/test_learning/test_em_single_component.py
          pre-commit run --files geomstats/learning/expectation_maximization.py tests/tests_geomstats/test_learning/test_em_single_component.py
          git diff --exit-code -- geomstats/learning/expectation_maximization.py tests/tests_geomstats/test_learning/test_em_single_component.py
          git diff --check 2fc8e25eb8955767292552f9c0c1438be362ba8f...HEAD
          test "$(git rev-parse HEAD)" = "abc78a6b66784a8c95a3c94583c90df8d3d275c4"

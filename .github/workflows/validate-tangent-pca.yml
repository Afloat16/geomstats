name: Validate TangentPCA matrix reconstruction

on:
  push:
    branches: [validation/tangent-pca-matrix-20261115]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, autograd]
    env:
      GEOMSTATS_BACKEND: ${{ matrix.backend }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      JUPYTER_PLATFORM_DIRS: 1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 2690ebe5392bcc6bd5ceca655dcc278ee3038bdd
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Install package and validation dependencies
        run: |
          python -m pip install --no-cache-dir -e '.[autograd,graph,test]' pytest pytest-cov ruff==0.4.8 pre-commit
          python -m pip freeze
      - name: Reproduce all six regressions on the original implementation
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET
          
          source = pathlib.Path("geomstats/learning/pca.py")
          candidate = source.read_bytes()
          try:
              source.write_bytes(subprocess.check_output(["git", "show", "2fc8e25eb8955767292552f9c0c1438be362ba8f:geomstats/learning/pca.py"]))
              result = subprocess.run([
                  "python", "-m", "pytest", "-q",
                  "tests/tests_geomstats/test_learning/test_pca.py",
                  "-k", "rotation_matrix_round_trip or rectangular_matrix_round_trip or transform_retains_fitted_matrix_coordinates or compressed_matrix_coordinates_reject_nonsymmetric_queries",
                  "--junitxml=baseline-regressions.xml",
              ], check=False)
          finally:
              source.write_bytes(candidate)
          root = ET.parse("baseline-regressions.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          counts = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          print({"baseline_exit": result.returncode, **counts})
          assert result.returncode == 1 and counts == {"tests": 6, "failures": 6, "errors": 0, "skipped": 0}, counts
          
          PY
      - name: Run complete affected learning and geometry modules
        run: |
          python -m pytest -q tests/tests_geomstats/test_learning tests/tests_geomstats/test_geometry/test_matrices.py tests/tests_geomstats/test_geometry/test_special_orthogonal.py tests/tests_geomstats/test_geometry/test_spd_matrices.py -m 'not (slow or redundant)' --junitxml=candidate-tests.xml
      - name: Check formatting, hooks, and exact candidate source
        run: |
          ruff check geomstats/learning/pca.py tests/tests_geomstats/test_learning/test_pca.py
          ruff format --check geomstats/learning/pca.py tests/tests_geomstats/test_learning/test_pca.py
          pre-commit run --files geomstats/learning/pca.py tests/tests_geomstats/test_learning/test_pca.py
          git diff --exit-code -- geomstats/learning/pca.py tests/tests_geomstats/test_learning/test_pca.py
          git diff --check 2fc8e25eb8955767292552f9c0c1438be362ba8f...HEAD
          test "$(git rev-parse HEAD)" = "2690ebe5392bcc6bd5ceca655dcc278ee3038bdd"

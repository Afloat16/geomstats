name: Validate broadcast gradients and initial-time integration

on:
  push:
    branches: ["validation/geomstats-shape-regressions-20261116"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: "gradient-input-broadcast"
            backend: "autograd"
            sha: "0e37b88062c9e9498c7ccd3efdb4ceaa79a0096a"
            source: "geomstats/_backend/autograd/autodiff.py"
            sources: "geomstats/_backend/autograd/autodiff.py geomstats/_backend/pytorch/autodiff.py"
            regression: "tests/tests_geomstats/test_backend/test_value_and_grad_broadcasting.py"
            adjacent: "tests/tests_geomstats/test_backend/test_autodiff.py"
            covered_lines: "[48,51,55,181,182]"
          - candidate: "gradient-input-broadcast"
            backend: "pytorch"
            sha: "0e37b88062c9e9498c7ccd3efdb4ceaa79a0096a"
            source: "geomstats/_backend/pytorch/autodiff.py"
            sources: "geomstats/_backend/autograd/autodiff.py geomstats/_backend/pytorch/autodiff.py"
            regression: "tests/tests_geomstats/test_backend/test_value_and_grad_broadcasting.py"
            adjacent: "tests/tests_geomstats/test_backend/test_autodiff.py"
            covered_lines: "[50,52,56,351,352,353]"
          - candidate: "ivp-initial-time"
            backend: "numpy"
            sha: "bc4d7d953aa37836b26a06f2aef16bbe1474f7b6"
            source: "geomstats/numerics/ivp.py"
            sources: "geomstats/numerics/ivp.py"
            regression: "tests/tests_geomstats/test_numerics/test_ivp_initial_time.py"
            adjacent: "tests/tests_geomstats/test_numerics/test_exp.py"
            covered_lines: "[283,298,299,300]"
          - candidate: "ivp-initial-time"
            backend: "autograd"
            sha: "bc4d7d953aa37836b26a06f2aef16bbe1474f7b6"
            source: "geomstats/numerics/ivp.py"
            sources: "geomstats/numerics/ivp.py"
            regression: "tests/tests_geomstats/test_numerics/test_ivp_initial_time.py"
            adjacent: "tests/tests_geomstats/test_numerics/test_exp.py"
            covered_lines: "[283,298,299,300]"
          - candidate: "ivp-initial-time"
            backend: "pytorch"
            sha: "bc4d7d953aa37836b26a06f2aef16bbe1474f7b6"
            source: "geomstats/numerics/ivp.py"
            sources: "geomstats/numerics/ivp.py"
            regression: "tests/tests_geomstats/test_numerics/test_ivp_initial_time.py"
            adjacent: "tests/tests_geomstats/test_numerics/test_exp.py"
            covered_lines: "[283,298,299,300]"
    env:
      GEOMSTATS_BACKEND: ${{ matrix.backend }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCIPY_ARRAY_API: ${{ matrix.backend == 'pytorch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        if: matrix.backend == 'pytorch'
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest coverage ruff nbformat nbconvert autograd
      - name: Verify regressions fail on unchanged upstream
        run: |
          for source in ${{ matrix.sources }}; do
            git show 2fc8e25eb8955767292552f9c0c1438be362ba8f:"$source" > "$source"
          done
          set +e
          python -m pytest -q -p no:cacheprovider ${{ matrix.regression }} > baseline.txt 2>&1
          status=$?
          set -e
          cat baseline.txt
          test "$status" -eq 1
          git checkout ${{ matrix.sha }} -- ${{ matrix.sources }}
      - name: Test candidate and adjacent existing behavior
        run: |
          python -m coverage run --include="*/${{ matrix.source }}" -m pytest -q -p no:cacheprovider ${{ matrix.regression }} ${{ matrix.adjacent }}
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coverage.json").read_text())
          executed = set(report["files"]["${{ matrix.source }}"]["executed_lines"])
          required = set(json.loads('${{ matrix.covered_lines }}'))
          assert required <= executed, f"Uncovered changed lines: {required - executed}"
          print("All changed executable lines are covered.")
          PY
      - name: Check formatting and lint
        run: |
          ruff check ${{ matrix.sources }} ${{ matrix.regression }}
          ruff format --check ${{ matrix.sources }} ${{ matrix.regression }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate }}-${{ matrix.backend }}-regression-results
          path: |
            baseline.txt
            coverage.json

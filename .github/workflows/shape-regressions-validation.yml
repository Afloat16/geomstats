name: Validate BVP callback conversion and endpoint broadcasting

on:
  push:
    branches: ["validation/geomstats-shape-regressions-20261116"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, autograd, pytorch]
        candidate: [boundary-jacobian, endpoint-broadcasting]
        include:
          - candidate: boundary-jacobian
            sha: 6c3a5bd6eafd7e9e214da086b97ae848e9dd29f3
            source: geomstats/numerics/bvp.py
            regression: tests/tests_geomstats/test_numerics/test_bvp_boundary_jacobian.py
            adjacent: tests/tests_geomstats/test_numerics/test_log.py::TestLogSolverAgainstClosedForm tests/tests_geomstats/test_numerics/test_log.py::TestLogODESolverMatrix
            covered_lines: "[41,43,44,47]"
          - candidate: endpoint-broadcasting
            sha: e4d3ce2fb14989d0171261901ef4810f835ae74b
            source: geomstats/numerics/geodesic.py
            regression: tests/tests_geomstats/test_numerics/test_bvp_broadcasting.py
            adjacent: tests/tests_geomstats/test_numerics/test_log.py
            covered_lines: "[268,270,271,274,275,276,282,411,619,621,622,625,626,650,653,656,710,712,713,716,717,718,724]"
    env:
      GEOMSTATS_BACKEND: ${{ matrix.backend }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCIPY_ARRAY_API: ${{ matrix.backend == 'pytorch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        if: matrix.backend == 'pytorch'
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest coverage ruff nbformat nbconvert autograd
      - name: Check expected baseline behavior on unchanged upstream
        run: |
          git show 2fc8e25eb8955767292552f9c0c1438be362ba8f:${{ matrix.source }} > ${{ matrix.source }}
          set +e
          python -m pytest -q -p no:cacheprovider ${{ matrix.regression }} > baseline.txt 2>&1
          status=$?
          set -e
          cat baseline.txt
          expected=1
          if [ "${{ matrix.candidate }}" = "boundary-jacobian" ] && [ "${{ matrix.backend }}" != "pytorch" ]; then
            expected=0
          fi
          test "$status" -eq "$expected"
          git checkout ${{ matrix.sha }} -- ${{ matrix.source }}
      - name: Test the candidate and adjacent existing behavior
        run: |
          python -m coverage run --include="*/${{ matrix.source }}" -m pytest -q -p no:cacheprovider ${{ matrix.regression }} ${{ matrix.adjacent }}
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coverage.json").read_text())
          executed = set(report["files"]["${{ matrix.source }}"]["executed_lines"])
          required = set(json.loads('${{ matrix.covered_lines }}'))
          assert required <= executed, f"Uncovered changed lines: {required - executed}"
          print("All changed executable lines are covered.")
          PY
      - name: Check formatting and lint
        run: |
          ruff check ${{ matrix.source }} ${{ matrix.regression }}
          ruff format --check ${{ matrix.source }} ${{ matrix.regression }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate }}-${{ matrix.backend }}-regression-results
          path: |
            baseline.txt
            coverage.json

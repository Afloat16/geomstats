name: Validate callable IVP steps and reproduce BVP callback mismatch

on:
  push:
    branches: ["validation/geomstats-shape-regressions-20261116"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, autograd, pytorch]
        candidate: [custom-ivp]
        include:
          - candidate: custom-ivp
            sha: b6b7ec188dabc42fe64c5f95ad7884f730cca463
            source: geomstats/numerics/ivp.py
            regression: tests/tests_geomstats/test_numerics/test_custom_ivp_steps.py
            adjacent: tests/tests_geomstats/test_numerics/test_exp.py
            covered_lines: "[178, 179, 181, 184, 185, 187, 189, 190, 194]"
    env:
      GEOMSTATS_BACKEND: ${{ matrix.backend }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCIPY_ARRAY_API: ${{ matrix.backend == 'pytorch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        if: matrix.backend == 'pytorch'
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest coverage ruff nbformat nbconvert autograd
      - name: Verify regression tests fail on unchanged upstream
        run: |
          git show 2fc8e25eb8955767292552f9c0c1438be362ba8f:${{ matrix.source }} > ${{ matrix.source }}
          set +e
          python -m pytest -q -p no:cacheprovider ${{ matrix.regression }} > baseline.txt 2>&1
          status=$?
          set -e
          cat baseline.txt
          test "$status" -eq 1
          git checkout ${{ matrix.sha }} -- ${{ matrix.source }}
      - name: Test the candidate and adjacent existing behavior
        run: |
          python -m coverage run --include="*/${{ matrix.source }}" -m pytest -q -p no:cacheprovider ${{ matrix.regression }} ${{ matrix.adjacent }}
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coverage.json").read_text())
          executed = set(report["files"]["${{ matrix.source }}"]["executed_lines"])
          required = set(json.loads('${{ matrix.covered_lines }}'))
          assert required <= executed, f"Uncovered changed lines: {required - executed}"
          print("All changed executable lines are covered.")
          PY
      - name: Check formatting and lint
        run: |
          ruff check ${{ matrix.source }} ${{ matrix.regression }}
          ruff format --check ${{ matrix.source }} ${{ matrix.regression }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate }}-${{ matrix.backend }}-regression-results
          path: |
            baseline.txt
            coverage.json

  reproduce-boundary-jacobian:
    runs-on: ubuntu-latest
    env:
      GEOMSTATS_BACKEND: pytorch
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCIPY_ARRAY_API: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9806fde0e2190d09c7cc5e004cc8609001a7a2fe
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest nbformat nbconvert
      - name: Reproduce callback backend mismatch on unchanged upstream
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider tests/tests_geomstats/test_numerics/test_bvp_boundary_jacobian.py > baseline-bvp.txt 2>&1
          status=$?
          set -e
          cat baseline-bvp.txt
          test "$status" -eq 1
          python - <<'PY'
          from pathlib import Path
          log = Path("baseline-bvp.txt").read_text()
          assert "2 failed, 1 passed" in log, log
          assert "TypeError" in log and "zeros_like" in log and "numpy.ndarray" in log, log
          print("Confirmed that boundary Jacobian receives NumPy arrays instead of backend tensors.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvp-boundary-jacobian-pytorch-baseline
          path: baseline-bvp.txt

name: Validate metric bases and concentrated directional sampling

on:
  push:
    branches: ["validation/geomstats-shape-regressions-20261116"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, autograd, pytorch]
        candidate: [normal-basis, vmf-concentration]
        include:
          - candidate: normal-basis
            sha: 4bb57d8e9c621c973f7b62a10fbd335789d59425
            source: geomstats/geometry/riemannian_metric.py
            regression: tests/tests_geomstats/test_geometry/test_metric_basis_normalization.py
            adjacent: tests/tests_geomstats/test_geometry/test_euclidean.py tests/tests_geomstats/test_geometry/test_matrices.py
            covered_lines: "[538,541]"
          - candidate: vmf-concentration
            sha: 97e2c8f1437c5c78c3192e135d4b89ef6dc565e0
            source: geomstats/geometry/hypersphere.py
            regression: tests/tests_geomstats/test_geometry/test_von_mises_fisher_concentration.py
            adjacent: tests/tests_geomstats/test_geometry/test_hypersphere.py::TestVonMisesFisher tests/tests_geomstats/test_geometry/test_hypersphere.py::TestVonMisesFisherKappa tests/tests_geomstats/test_geometry/test_hypersphere.py::TestHypersphereMetric::test_exp_after_log
            covered_lines: "[534,1555,1556,1557,1559,1560,1566,1567,1568,1569,1581,1591,1592,1596]"
    env:
      GEOMSTATS_BACKEND: ${{ matrix.backend }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCIPY_ARRAY_API: ${{ matrix.backend == 'pytorch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        if: matrix.backend == 'pytorch'
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest coverage ruff nbformat nbconvert autograd
      - name: Verify regression tests fail on unchanged upstream
        run: |
          git show 2fc8e25eb8955767292552f9c0c1438be362ba8f:${{ matrix.source }} > ${{ matrix.source }}
          set +e
          python -m pytest -q -p no:cacheprovider ${{ matrix.regression }} > baseline.txt 2>&1
          status=$?
          set -e
          cat baseline.txt
          test "$status" -eq 1
          git checkout ${{ matrix.sha }} -- ${{ matrix.source }}
      - name: Test the candidate and adjacent existing behavior
        run: |
          python -m coverage run --include="*/${{ matrix.source }}" -m pytest -q -p no:cacheprovider ${{ matrix.regression }} ${{ matrix.adjacent }}
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coverage.json").read_text())
          executed = set(report["files"]["${{ matrix.source }}"]["executed_lines"])
          required = set(json.loads('${{ matrix.covered_lines }}'))
          assert required <= executed, f"Uncovered changed lines: {required - executed}"
          print("All changed executable lines are covered.")
          PY
      - name: Check formatting and lint
        run: |
          ruff check ${{ matrix.source }} ${{ matrix.regression }}
          ruff format --check ${{ matrix.source }} ${{ matrix.regression }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate }}-${{ matrix.backend }}-regression-results
          path: |
            baseline.txt
            coverage.json
